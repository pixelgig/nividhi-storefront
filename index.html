{font-size:21px;font-weight:800;margin:13px 0}.mrp{text-decoration:line-through;color:#988b8e;font-weight:400;font-size:14px;margin-left:6px}.save{font-size:12px;color:var(--green);margin-left:6px}.desc{color:var(--muted);font-size:14px;line-height:1.5}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}.status{text-align:center;padding:50px;color:var(--muted)}.trust{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:55px 0}.trust>div{background:#fff;border:1px solid var(--line);padding:22px;border-radius:18px}.trust b{display:block;margin-bottom:7px}.promo{background:var(--ink);color:#fff;border-radius:28px;padding:38px;margin:55px 0;display:flex;justify-content:space-between;gap:25px;align-items:center}.promo h2{font:38px Georgia;margin:0}.promo p{color:#d8ced0}.promo .btn{border-color:#fff}.detail{display:grid;grid-template-columns:1.05fr .95fr;gap:44px}.gallery-main{aspect-ratio:1;background:#f3e9e8;border-radius:24px;overflow:hidden;display:flex;align-items:center;justify-content:center;cursor:zoom-in}.gallery-main img{width:100%;height:100%;object-fit:cover}.thumbs{display:flex;gap:10px;margin-top:10px}.thumbs img{width:78px;height:78px;object-fit:cover;border-radius:10px;border:1px solid var(--line);cursor:pointer}.product-info h1{font-size:48px}.stock{font-size:13px;color:var(--green);font-weight:700}.specs{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:22px 0}.spec{background:#fff;padding:13px}.spec small{display:block;color:var(--muted);margin-bottom:4px}.back{display:inline-block;margin-bottom:20px;color:var(--rose);text-decoration:none}.infoBox{border-top:1px solid var(--line);padding:16px 0}.infoBox b{display:block;margin-bottom:6px}.marketbox{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:20px}.marketbox h3{font:21px Georgia;margin:0 0 10px}.content-card{background:#fff;border:1px solid var(-- <script>
const SHEET_ID='1M2PsStJmo6hIPDA7pwoAKatrtoHNUiun-kHA26cCZZo',FALLBACK_WA='917669292626';let PRODUCTS=[],SET={},CATEGORIES=[],filterCat='',searchQ='',sortBy='featured';
const gvizUrl=s=>`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(s)}&t=${Date.now()}`;
async function sheet(s){const r=await fetch(gvizUrl(s),{cache:'no-store'});if(!r.ok)throw Error('Sheet '+s+' unavailable');const t=await r.text(),j=JSON.parse(t.slice(t.indexOf('{'),t.lastIndexOf('}')+1)),h=j.table.cols.map(c=>(c.label||'').trim());return j.table.rows.map(row=>Object.fromEntries(h.map((k,i)=>[k,row.c?.[i]?.v??''])));}
const yes=v=>String(v).trim().toUpperCase()==='YES',num=v=>{if(typeof v==='number')return Number.isFinite(v)?v:null;const s=String(v??'').replace(/[^0-9.-]/g,'');if(!s)return null;const n=Number(s);return Number.isFinite(n)?n:null},INR=v=>{const n=num(v);return n===null?'':new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0}).format(n)},esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),slug=s=>String(s??'').toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const wish=()=>JSON.parse(localStorage.getItem('nividhiWishlist')||'[]'),setWish=a=>{localStorage.setItem('nividhiWishlist',JSON.stringify(a));updateWish()},updateWish=()=>{const e=document.getElementById('wishCount');if(e)e.textContent=wish().length};
function toggleWish(sku,e){let w=wish();w=w.includes(sku)?w.filter(x=>x!==sku):[...w,sku];setWish(w);if(e)e.textContent=w.includes(sku)?'♥':'♡'}
function go(path){history.pushState({},'',path);render()}document.addEventListener('click',e=>{const a=e.target.closest('a[data-link]');if(a){e.preventDefault();go(a.getAttribute('href'))}});addEventListener('popstate',render);
function discount(p){const d=num(p['Direct Price']),m=num(p.MRP);return d&&m&&m>d?Math.round((m-d)/m*100):0}
function productPath(p){return '/products/'+slug(p['Product Name'])+'-'+encodeURIComponent(p.SKU)}
function marketLinks(p,detail=false){const wa=String(SET['WhatsApp Number']||FALLBACK_WA).replace(/\D/g,''),price=INR(p['Direct Price']),path=location.origin+productPath(p),msg=encodeURIComponent(`Hi NIVIDHI, I want to order:
${p['Product Name']}
SKU: ${p.SKU}
Price: ${price||'Please confirm'}
Quantity: 1
Product: ${path}
Please confirm availability.`);let a='';if((num(p['Stock Qty'])??0)>0&&yes(SET['Direct Order Enabled']||'YES'))a+=`<a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/${wa}?text=${msg}">WhatsApp · ${price||'Enquire'}</a>`;[['Amazon','Amazon URL','Amazon Price'],['Meesho','Meesho URL','Meesho Price'],['Flipkart','Flipkart URL','Flipkart Price']].forEach(([n,u,pr])=>{if(p[u])a+=`<a class="btn" target="_blank" rel="noopener" href="${esc(p[u])}">${n}${p[pr]?' · '+INR(p[pr]):''}</a>`});if(!detail)a+=`<a class="btn soft" data-link href="${productPath(p)}">View Details</a>`;return a}
function card(p){const img=String(p['Image 1 URL']||''),direct=INR(p['Direct Price']),mrp=INR(p.MRP),badge=yes(p['New Arrival'])?'NEW':yes(p.Featured)?'FEATURED':'',d=discount(p),liked=wish().includes(String(p.SKU));return `<article class="product"><button class="heart" aria-label="Wishlist" onclick="toggleWish('${esc(p.SKU)}',this)">${liked?'♥':'♡'}</button><a class="piclink" data-link href="${productPath(p)}"><div class="pic">${img?`<img src="${esc(img)}" alt="${esc(p['Product Name'])}" loading="lazy">`:'<div class="placeholder">◇</div>'}${badge?`<span class="badge">${badge}</span>`:''}</div></a><div class="details"><div class="sku">${esc(p.Category)} · ${esc(p.SKU)}</div><h3><a data-link href="${productPath(p)}">${esc(p['Product Name'])}</a></h3><div class="price">${direct||'Price on request'}${mrp?`<span class="mrp">${mrp}</span>`:''}${d?`<span class="save">${d}% off</span>`:''}</div><div class="desc">${esc(p['Short Description'])}</div><div class="actions">${marketLinks(p)}</div></div></article>`}
function categoryNames(){return [...new Set(PRODUCTS.map(p=>String(p.Category||'').trim()).filter(Boolean))]}
function filtered(){let a=[...PRODUCTS];if(filterCat)a=a.filter(p=>slug(p.Category)===filterCat);if(searchQ){const q=searchQ.toLowerCase();a=a.filter(p=>[p['Product Name'],p.SKU,p.Category,p.Subcategory,p.Material,p.Colour].join(' ').toLowerCase().includes(q))}if(sortBy==='low')a.sort((a,b)=>(num(a['Direct Price'])??1e9)-(num(b['Direct Price'])??1e9));else if(sortBy==='high')a.sort((a,b)=>(num(b['Direct Price'])??0)-(num(a['Direct Price'])??0));else if(sortBy==='new')a.sort((a,b)=>(yes(b['New Arrival'])?1:0)-(yes(a['New Arrival'])?1:0));return a}
function shop(cat=''){filterCat=cat||filterCat;const items=filtered(),cats=categoryNames();return `<main><section><div class="section-head"><div><div class="eyebrow">Catalogue</div><h2>Shop NIVIDHI</h2></div><p id="resultCount">${items.length} products</p></div><div class="tools"><input aria-label="Search products" placeholder="Search products, SKU, colour…" value="${esc(searchQ)}" oninput="searchQ=this.value;refreshGrid()"><select onchange="sortBy=this.value;refreshGrid()"><option value="featured">Featured</option><option value="new" ${sortBy==='new'?'selected':''}>Newest</option><option value="low" ${sortBy==='low'?'selected':''}>Price: Low to High</option><option value="high" ${sortBy==='high'?'selected':''}>Price: High to Low</option></select><button class="btn" onclick="filterCat='';searchQ='';refreshGrid()">Clear</button></div><div class="chips"><button class="chip ${!filterCat?'active':''}" onclick="filterCat='';refreshGrid()">All</button>${cats.map(c=>`<button class="chip ${filterCat===slug(c)?'active':''}" onclick="filterCat='${slug(c)}';refreshGrid()">${esc(c)}</button>`).join('')}</div><div class="grid" id="productGrid">${items.map(card).join('')||'<div class="empty">No products match your filters.</div>'}</div></section></main>`}
function refreshGrid(){const a=filtered(),g=document.getElementById('productGrid');if(g)g.innerHTML=a.map(card).join('')||'<div class="empty">No products match your filters.</div>';const c=document.getElementById('resultCount');if(c)c.textContent=a.length+' products'}
function home(){const featured=PRODUCTS.filter(p=>yes(p.Featured)||yes(p['New Arrival'])).slice(0,6),cats=categoryNames();return `<section class="hero"><div><div class="eyebrow">Jewellery • Accessories • Everyday elegance</div><h1>Little details.<br>Beautifully yours.</h1><p>Discover NIVIDHI jewellery and accessories for everyday styling, gifting and special moments. Shop direct or choose your preferred marketplace.</p><div class="actions"><a class="btn primary" data-link href="/shop">Shop collection</a><a class="btn" data-link href="/about">Our story</a></div></div><div class="heroArt">◇</div></section><main><div class="section-head"><div><div class="eyebrow">Explore</div><h2>Shop by category</h2></div></div><div class="categoryStrip">${cats.slice(0,5).map(c=>`<a class="cat" data-link href="/category/${slug(c)}">◇<span>${esc(c)}</span></a>`).join('')}</div><div class="section-head"><div><div class="eyebrow">Selected for you</div><h2>New & featured</h2></div><a class="btn" data-link href="/shop">View all</a></div><div class="grid">${(featured.length?featured:PRODUCTS.slice(0,6)).map(card).join('')}</div><div class="promo"><div><div class="eyebrow" style="color:#e8cbd1">Order your way</div><h2>Direct or marketplace.</h2><p>Compare the available buying options on each product and choose what works for you.</p></div><a class="btn" data-link href="/shop">Browse products</a></div><div class="trust"><div><b>Easy direct ordering</b><span class="muted">Send the product, SKU and price to NIVIDHI on WhatsApp in one tap.</span></div><div><b>Multiple buying options</b><span class="muted">Amazon, Meesho and Flipkart buttons appear whenever their links are available.</span></div><div><b>Live catalogue</b><span class="muted">Price, stock and product information are kept in sync with our catalogue.</span></div></div></main>`}
function findProduct(token){const dec=decodeURIComponent(token);return PRODUCTS.find(p=>dec.endsWith(String(p.SKU))||dec===String(p.SKU)||slug(p['Product Name'])===dec)}
function setSEO(p){let title='NIVIDHI — Jewellery & Accessories',desc='Discover NIVIDHI jewellery and accessories. Shop direct or through your preferred marketplace.',img='';if(p){title=`${p['Product Name']} | NIVIDHI`;desc=p['SEO Description']||p['Short Description']||desc;img=p['Image 1 URL']||''}document.title=title;document.querySelector('meta[name=description]').content=desc;document.querySelector('meta[property="og:title"]').content=title;document.querySelector('meta[property="og:description"]').content=desc;if(img){let m=document.querySelector('meta[property="og:image"]');if(!m){m=document.createElement('meta');m.setAttribute('property','og:image');document.head.appendChild(m)}m.content=img}document.getElementById('canonical').href=location.origin+location.pathname}
function schema(p){document.getElementById('productSchema')?.remove();if(!p)return;const price=num(p['Direct Price']),imgs=['Image 1 URL','Image 2 URL','Image 3 URL'].map(k=>p[k]).filter(Boolean);const o={"@context":"https://schema.org/","@type":"Product",name:p['Product Name'],sku:String(p.SKU),description:p['Short Description']||'',image:imgs,brand:{"@type":"Brand",name:"NIVIDHI"},category:p.Category||'',material:p.Material||'',color:p.Colour||''};if(price)o.offers={"@type":"Offer",priceCurrency:"INR",price:String(price),availability:(num(p['Stock Qty'])??0)>0?"https://schema.org/InStock":"https://schema.org/OutOfStock",url:location.href,itemCondition:"https://schema.org/NewCondition"};const s=document.createElement('script');s.type='application/ld+json';s.id='productSchema';s.textContent=JSON.stringify(o);document.head.appendChild(s)}
function product(token){const p=findProduct(token);if(!p)return '<div class="page"><h1>Product not found</h1><a class="btn" data-link href="/shop">Back to shop</a></div>';setSEO(p);schema(p);const imgs=['Image 1 URL','Image 2 URL','Image 3 URL'].map(k=>String(p[k]||'')).filter(Boolean),direct=INR(p['Direct Price']),mrp=INR(p.MRP),d=discount(p),stock=num(p['Stock Qty'])??0,care=p['Care Instructions']||'Keep away from water, perfume and harsh chemicals. Store separately in a dry place when not in use.',delivery=p['Delivery Information']||'For direct orders, confirm delivery availability and charges with us on WhatsApp before payment.';const related=PRODUCTS.filter(x=>x.SKU!==p.SKU&&x.Category===p.Category).slice(0,3);return `<div class="page"><a class="back" data-link href="/shop">← Back to shop</a><div class="detail"><div><div class="gallery-main" onclick="zoomImage()"><div id="mainPic">${imgs[0]?`<img src="${esc(imgs[0])}" alt="${esc(p['Product Name'])}">`:'<div class="placeholder">◇</div>'}</div></div>${imgs.length>1?`<div class="thumbs">${imgs.map(x=>`<img src="${esc(x)}" onclick="document.querySelector('#mainPic img').src=this.src" alt="">`).join('')}</div>`:''}</div><div class="product-info"><div class="eyebrow">${esc(p.Category)} · ${esc(p.SKU)}</div><h1>${esc(p['Product Name'])}</h1><div class="stock">${stock>0?'● In stock':'Out of stock'}</div><div class="price">${direct||'Price on request'}${mrp?`<span class="mrp">${mrp}</span>`:''}${d?`<span class="save">Save ${d}%</span>`:''}</div><p class="lead">${esc(p['Long Description']||p['Short Description'])}</p><div class="specs"><div class="spec"><small>Material</small>${esc(p.Material)||'—'}</div><div class="spec"><small>Colour</small>${esc(p.Colour)||'—'}</div><div class="spec"><small>Plating</small>${esc(p.Plating)||'—'}</div><div class="spec"><small>SKU</small>${esc(p.SKU)}</div></div><div class="marketbox"><h3>Available on</h3><div class="actions">${marketLinks(p,true)}</div></div><div class="actions"><button class="btn" onclick="toggleWish('${esc(p.SKU)}',this)">♡ Save to wishlist</button><button class="btn" onclick="shareProduct('${esc(p['Product Name'])}')">Share</button></div><div class="infoBox"><b>Delivery information</b><span class="muted">${esc(delivery)}</span></div><div class="infoBox"><b>Jewellery care</b><span class="muted">${esc(care)}</span></div></div></div>${related.length?`<div class="section-head" style="margin-top:65px"><div><div class="eyebrow">You may also like</div><h2>Related products</h2></div></div><div class="grid">${related.map(card).join('')}</div>`:''}</div>`}
function zoomImage(){const i=document.querySelector('#mainPic img');if(i){document.getElementById('zoomImg').src=i.src;document.getElementById('zoom').classList.add('open')}}
async function shareProduct(name){if(navigator.share)await navigator.share({title:name,text:'See this NIVIDHI product',url:location.href});else{await navigator.clipboard.writeText(location.href);alert('Product link copied')}}
function wishlistPage(){const w=wish(),a=PRODUCTS.filter(p=>w.includes(String(p.SKU)));return `<div class="page"><div class="eyebrow">Saved for later</div><h1>Wishlist</h1>${a.length?`<div class="grid">${a.map(card).join('')}</div>`:'<div class="empty">Your wishlist is empty.<br><br><a class="btn" data-link href="/shop">Explore products</a></div>'}</div>`}
const policy=(title,html)=>`<div class="page"><div class="eyebrow">NIVIDHI customer care</div><h1>${title}</h1><div class="content-card">${html}</div></div>`;
function about(){return policy('About NIVIDHI','<p>NIVIDHI is a jewellery and accessories brand by Chaudhary Enterprises, created for stylish, wearable pieces for everyday looks, gifting and special occasions.</p><p>Our online catalogue makes it easy to discover products, compare available purchase channels and contact us directly when you prefer a WhatsApp order.</p>')}
function contact(){const wa=String(SET['WhatsApp Number']||FALLBACK_WA).replace(/\D/g,'');return `<div class="page"><div class="eyebrow">We’re here to help</div><h1>Contact NIVIDHI</h1><div class="contactGrid"><div class="content-card"><h2>Product & order support</h2><p>For availability, direct orders or product questions, message us with the product name or SKU.</p><a class="btn primary" target="_blank" rel="noopener" href="https://wa.me/${wa}?text=${encodeURIComponent('Hi NIVIDHI, I have a question about your products.')}">Chat on WhatsApp</a></div><div class="content-card"><h2>Social & marketplaces</h2><p>Follow or shop NIVIDHI through the channels currently available.</p><div class="actions">${SET['Instagram URL']?`<a class="btn" target="_blank" href="${esc(SET['Instagram URL'])}">Instagram</a>`:''}${SET['Amazon Store URL']?`<a class="btn" target="_blank" href="${esc(SET['Amazon Store URL'])}">Amazon Store</a>`:''}${SET['Meesho Store URL']?`<a class="btn" target="_blank" href="${esc(SET['Meesho Store URL'])}">Meesho Store</a>`:''}</div></div></div></div>`}
function route(){const p=location.pathname.replace(/\/+$/,'')||'/';filterCat='';if(p==='/')return home();if(p==='/shop')return shop();if(p.startsWith('/category/'))return shop(p.split('/')[2]);if(p.startsWith('/products/'))return product(p.slice(10));if(p==='/about')return about();if(p==='/contact')return contact();if(p==='/wishlist')return wishlistPage();if(p==='/shipping-policy')return policy('Shipping Policy','<p>For direct WhatsApp orders, shipping availability, charges and estimated delivery time are confirmed before payment. Marketplace orders follow the shipping terms shown by the respective marketplace at checkout.</p><p>Please verify your delivery details carefully when placing an order.</p>');if(p==='/returns')return policy('Returns & Replacement','<p>For direct orders, please contact NIVIDHI promptly if an item arrives damaged, defective or incorrect. Keep the packaging and provide clear photos or video so the issue can be reviewed.</p><p>Orders placed on Amazon, Meesho or Flipkart are governed by the return/replacement process displayed on that marketplace for the specific order.</p>');if(p==='/privacy')return policy('Privacy Policy','<p>This catalogue does not require a customer account. If you contact NIVIDHI through WhatsApp or another external service, information you choose to provide is used to respond to your enquiry and process your order.</p><p>External marketplaces and services operate under their own privacy policies. Basic website usage analytics may be collected to understand site performance and product interest.</p>');if(p==='/terms')return policy('Terms & Conditions','<p>Product availability, prices and offers may change. A direct order is confirmed only after NIVIDHI confirms availability, final amount, delivery details and payment instructions.</p><p>Marketplace purchases are also subject to the terms of the marketplace where the transaction is completed. Product colours may appear slightly different depending on lighting and display settings.</p>');return policy('Page not found','<p>The page you requested could not be found.</p><a class="btn" data-link href="/shop">Go to shop</a>')}
function render(){setSEO();schema(null);document.getElementById('app').innerHTML=route();updateWish();scrollTo(0,0)}
async function init(){try{const [p,s,c]=await Promise.all([sheet('Products'),sheet('Settings'),sheet('Categories').catch(()=>[])]);PRODUCTS=p.filter(x=>yes(x.Active)).sort((a,b)=>(num(a['Sort Order'])??999)-(num(b['Sort Order'])??999));SET=Object.fromEntries(s.map(x=>[String(x.Setting??'').trim(),x.Value??'']));CATEGORIES=c;const b=String(SET['Brand Name']||'NIVIDHI');document.querySelector('.brand').textContent=b;const an=String(SET['Announcement Text']||'').trim();if(an)document.getElementById('announce').textContent=an;render()}catch(e){document.getElementById('app').innerHTML='<div class="status">Could not load the catalogue. Please refresh in a moment.</div>';console.error(e)}}init();
</script></body></html>
