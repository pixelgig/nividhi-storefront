<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NIVIDHI — Jewellery & Accessories</title><meta name="description" content="Shop NIVIDHI jewellery and accessories."><style>
:root{--ink:#20191b;--muted:#75686c;--cream:#fbf7f3;--rose:#8b4d5c;--line:#eadfe1;--white:#fff}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:var(--cream)}header{position:sticky;top:0;z-index:10;background:#fbf7f3ee;backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}nav{max-width:1120px;margin:auto;min-height:70px;padding:0 20px;display:flex;align-items:center;justify-content:space-between}.brand{font-family:Georgia,serif;font-size:25px;letter-spacing:.22em;text-decoration:none;color:var(--ink)}.navlinks{display:flex;gap:20px;font-size:14px}.navlinks a{color:inherit;text-decoration:none}.hero,.page{max-width:1120px;margin:auto;padding:65px 20px 50px}.eyebrow{text-transform:uppercase;letter-spacing:.2em;font-size:12px;color:var(--rose);font-weight:700}.hero h1,.page h1{font-family:Georgia,serif;font-weight:500;font-size:clamp(42px,7vw,76px);line-height:1;margin:12px 0 18px}.hero p,.lead{color:var(--muted);font-size:17px;line-height:1.65;max-width:700px}.btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--ink);padding:12px 17px;border-radius:999px;text-decoration:none;color:var(--ink);font-weight:700;font-size:13px;background:#fff}.btn.primary{background:var(--ink);color:#fff}.btn.market{border-color:var(--line)}main{max-width:1120px;margin:auto;padding:20px 20px 70px}#shop{scroll-margin-top:85px}.section-head{display:flex;justify-content:space-between;align-items:end;margin:25px 0 22px}.section-head h2{font-family:Georgia,serif;font-size:36px;font-weight:500;margin:0}.section-head p,.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.product{background:var(--white);border:1px solid var(--line);border-radius:22px;overflow:hidden}.pic{aspect-ratio:1;background:linear-gradient(145deg,#f4e9e8,#fbf7f3);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}.pic img{width:100%;height:100%;object-fit:cover}.piclink{display:block;color:inherit}.placeholder{font-size:72px}.badge{position:absolute;top:14px;left:14px;background:white;border-radius:999px;padding:7px 10px;font-size:11px;font-weight:700;letter-spacing:.08em}.details{padding:18px}.details h3{font-family:Georgia,serif;font-size:23px;font-weight:500;margin:5px 0}.details h3 a{color:inherit;text-decoration:none}.sku{font-size:12px;color:var(--muted)}.price{font-size:21px;font-weight:750;margin:13px 0}.mrp{text-decoration:line-through;color:#988b8e;font-weight:400;font-size:14px;margin-left:6px}.desc{color:var(--muted);font-size:14px;line-height:1.5}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}.actions .wa{background:#1e211f;color:#fff;border-color:#1e211f}.status{text-align:center;padding:45px;color:var(--muted)}footer{border-top:1px solid var(--line);padding:35px 20px;color:var(--muted);font-size:13px}.foot{max-width:1120px;margin:auto;display:flex;justify-content:space-between;gap:20px}.detail{display:grid;grid-template-columns:1.05fr .95fr;gap:42px}.gallery-main{aspect-ratio:1;background:#f3e9e8;border-radius:22px;overflow:hidden;display:flex;align-items:center;justify-content:center}.gallery-main img{width:100%;height:100%;object-fit:cover}.thumbs{display:flex;gap:10px;margin-top:10px}.thumbs img{width:74px;height:74px;object-fit:cover;border-radius:10px;border:1px solid var(--line);cursor:pointer}.product-info h1{font-size:48px}.specs{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:22px 0}.spec{background:#fff;padding:13px}.spec small{display:block;color:var(--muted);margin-bottom:4px}.back{display:inline-block;margin-bottom:20px;color:var(--rose);text-decoration:none}.content-card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:28px;max-width:800px}.content-card p{line-height:1.8;color:var(--muted)}@media(max-width:760px){.navlinks{gap:12px;font-size:12px}.grid,.detail{grid-template-columns:1fr}.section-head,.foot{align-items:start;flex-direction:column;gap:8px}.hero h1,.page h1{font-size:45px}.product-info h1{font-size:38px}.hero,.page{padding-top:45px}.btn{padding:11px 14px}}
</style></head><body><header><nav><a class="brand" href="#/">NIVIDHI</a><div class="navlinks"><a href="#/">Home</a><a href="#/shop">Shop</a><a href="#/about">About</a><a href="#/contact">Contact</a></div></nav></header><div id="app"><div class="status">Loading NIVIDHI…</div></div><footer><div class="foot"><div><b>NIVIDHI</b><br>Jewellery & Accessories</div><div>© 2026 NIVIDHI · A Chaudhary Enterprises brand</div></div></footer><script>
const SHEET_ID='1M2PsStJmo6hIPDA7pwoAKatrtoHNUiun-kHA26cCZZo',FALLBACK_WA='917669292626';let PRODUCTS=[],SET={};
const gvizUrl=s=>`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(s)}&t=${Date.now()}`;
async function sheet(s){const r=await fetch(gvizUrl(s),{cache:'no-store'});if(!r.ok)throw Error('Sheet unavailable');const t=await r.text(),j=JSON.parse(t.slice(t.indexOf('{'),t.lastIndexOf('}')+1)),h=j.table.cols.map(c=>(c.label||'').trim());return j.table.rows.map(row=>Object.fromEntries(h.map((k,i)=>[k,row.c?.[i]?.v??''])));}
const yes=v=>String(v).trim().toUpperCase()==='YES',num=v=>{if(typeof v==='number')return Number.isFinite(v)?v:null;const s=String(v??'').replace(/[^0-9.-]/g,'');if(!s)return null;const n=Number(s);return Number.isFinite(n)?n:null},INR=v=>{const n=num(v);return n===null?'':new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0}).format(n)},esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),slug=s=>encodeURIComponent(String(s??''));
function links(p,detail=false){const wa=String(SET['WhatsApp Number']||FALLBACK_WA).replace(/\D/g,''),price=INR(p['Direct Price']),msg=encodeURIComponent(`Hi, I want to order ${p['Product Name']} (SKU: ${p.SKU})${price?' for '+price:''}. Please confirm availability.`);let a='';if((num(p['Stock Qty'])??0)>0&&yes(SET['Direct Order Enabled']||'YES'))a+=`<a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/${wa}?text=${msg}">WhatsApp Direct</a>`;[['Amazon','Amazon URL','Amazon Price'],['Meesho','Meesho URL','Meesho Price'],['Flipkart','Flipkart URL','Flipkart Price']].forEach(([n,u,pr])=>{if(p[u])a+=`<a class="btn market" target="_blank" rel="noopener" href="${esc(p[u])}">${n}${p[pr]?' · '+INR(p[pr]):''}</a>`});if(!detail)a+=`<a class="btn" href="#/product/${slug(p.SKU)}">View Details</a>`;return a}
function card(p){const img=String(p['Image 1 URL']||''),direct=INR(p['Direct Price']),mrp=INR(p.MRP),badge=yes(p['New Arrival'])?'NEW':yes(p.Featured)?'FEATURED':'';return `<article class="product"><a class="piclink" href="#/product/${slug(p.SKU)}"><div class="pic">${img?`<img src="${esc(img)}" alt="${esc(p['Product Name'])}" loading="lazy">`:'<div class="placeholder">◇</div>'}${badge?`<span class="badge">${badge}</span>`:''}</div></a><div class="details"><div class="sku">${esc(p.Category)} · ${esc(p.SKU)}</div><h3><a href="#/product/${slug(p.SKU)}">${esc(p['Product Name'])}</a></h3><div class="price">${direct||'Price on request'}${mrp?`<span class="mrp">${mrp}</span>`:''}</div><div class="desc">${esc(p['Short Description'])}</div><div class="actions">${links(p)}</div></div></article>`}
function shop(title='Shop NIVIDHI',items=PRODUCTS){return `<main><section id="shop"><div class="section-head"><div><div class="eyebrow">Catalogue</div><h2>${title}</h2></div><p>${items.length} product${items.length===1?'':'s'}</p></div><div class="grid">${items.map(card).join('')}</div></section></main>`}
function home(){const featured=PRODUCTS.filter(p=>yes(p.Featured)||yes(p['New Arrival']));return `<section class="hero"><div class="eyebrow">Jewellery • Accessories • Everyday elegance</div><h1>Little details.<br>Beautifully yours.</h1><p>Discover NIVIDHI jewellery and accessories. Order directly on WhatsApp or choose Amazon, Meesho or Flipkart whenever a product is available there.</p><a class="btn primary" href="#/shop">Shop collection</a></section>${shop('Featured collection',featured.length?featured:PRODUCTS)}`}
function product(sku){const p=PRODUCTS.find(x=>String(x.SKU)===decodeURIComponent(sku));if(!p)return '<div class="page"><h1>Product not found</h1><a class="btn" href="#/shop">Back to shop</a></div>';const imgs=['Image 1 URL','Image 2 URL','Image 3 URL'].map(k=>String(p[k]||'')).filter(Boolean),direct=INR(p['Direct Price']),mrp=INR(p.MRP);return `<div class="page"><a class="back" href="#/shop">← Back to shop</a><div class="detail"><div><div class="gallery-main" id="mainPic">${imgs[0]?`<img src="${esc(imgs[0])}" alt="${esc(p['Product Name'])}">`:'<div class="placeholder">◇</div>'}</div>${imgs.length>1?`<div class="thumbs">${imgs.map(x=>`<img src="${esc(x)}" onclick="document.querySelector('#mainPic img').src=this.src" alt="">`).join('')}</div>`:''}</div><div class="product-info"><div class="eyebrow">${esc(p.Category)} · ${esc(p.SKU)}</div><h1>${esc(p['Product Name'])}</h1><div class="price">${direct||'Price on request'}${mrp?`<span class="mrp">${mrp}</span>`:''}</div><p class="lead">${esc(p['Short Description'])}</p><div class="specs"><div class="spec"><small>Material</small>${esc(p.Material)||'—'}</div><div class="spec"><small>Colour</small>${esc(p.Colour)||'—'}</div><div class="spec"><small>Plating</small>${esc(p.Plating)||'—'}</div><div class="spec"><small>Availability</small>${(num(p['Stock Qty'])??0)>0?'In stock':'Out of stock'}</div></div><div class="actions">${links(p,true)}</div></div></div></div>`}
function about(){return `<div class="page"><div class="eyebrow">Our story</div><h1>About NIVIDHI</h1><div class="content-card"><p>NIVIDHI is a jewellery and accessories brand by Chaudhary Enterprises, created to bring stylish, wearable pieces together in one easy-to-browse collection.</p><p>Our catalogue includes fashion jewellery and accessories selected for everyday wear, gifting and special occasions. Customers can order directly through WhatsApp or use the marketplace options shown on each product.</p></div></div>`}
function contact(){const wa=String(SET['WhatsApp Number']||FALLBACK_WA).replace(/\D/g,'');return `<div class="page"><div class="eyebrow">Get in touch</div><h1>Contact NIVIDHI</h1><div class="content-card"><p>Questions about a product, availability or a direct order? Contact us on WhatsApp and mention the product name or SKU.</p><a class="btn primary" target="_blank" rel="noopener" href="https://wa.me/${wa}?text=${encodeURIComponent('Hi NIVIDHI, I have a question about your products.')}">Chat on WhatsApp</a>${SET['Instagram URL']?` <a class="btn" target="_blank" href="${esc(SET['Instagram URL'])}">Instagram</a>`:''}</div></div>`}
function render(){const r=location.hash.replace(/^#\/?/,'').split('/'),page=r[0]||'home';document.getElementById('app').innerHTML=page==='shop'?shop():page==='product'?product(r.slice(1).join('/')):page==='about'?about():page==='contact'?contact():home();scrollTo(0,0)}
async function init(){try{const [p,s]=await Promise.all([sheet('Products'),sheet('Settings')]);PRODUCTS=p.filter(x=>yes(x.Active)).sort((a,b)=>(num(a['Sort Order'])??999)-(num(b['Sort Order'])??999));SET=Object.fromEntries(s.map(x=>[String(x.Setting??'').trim(),x.Value??'']));const b=String(SET['Brand Name']||'NIVIDHI');document.querySelector('.brand').textContent=b;render();addEventListener('hashchange',render)}catch(e){document.getElementById('app').innerHTML='<div class="status">Could not load the catalogue. Please refresh in a moment.</div>';console.error(e)}}init();
</script></body></html>
